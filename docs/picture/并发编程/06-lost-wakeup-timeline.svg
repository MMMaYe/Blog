<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="530" viewBox="0 0 1240 530" font-family="PingFang SC, Hiragino Sans GB, STHeiti, Helvetica, Arial, sans-serif">
  <title>唤醒先到：命令被丢弃，许可被存下</title>
  <defs>
    <marker id="arwOrange" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/>
    </marker>
    <marker id="arwGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1f7a4d"/>
    </marker>
    <marker id="arwRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
    <pattern id="hatchRed" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#fdecec"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#e8a3a3" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1240" height="530" fill="#ffffff"/>
  <text x="620.0" y="40" font-size="22" fill="#1b2a41" text-anchor="middle" font-weight="bold">唤醒先到：一条命令被丢弃，一张许可被存下</text>
  <text x="620.0" y="66" font-size="13" fill="#777" text-anchor="middle">两行的交错完全相同——resume / unpark 都在 20 ms 到达，suspend / park 都在 100 ms 发生</text>
  <line x1="270" y1="104" x2="1150" y2="104" stroke="#9aa4b2" stroke-width="1.2"/>
  <line x1="270.0" y1="104" x2="270.0" y2="110" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="270.0" y="94" font-size="11" fill="#666" text-anchor="middle">0</text>
  <line x1="305.2" y1="104" x2="305.2" y2="110" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="305.2" y="94" font-size="11" fill="#666" text-anchor="middle">20</text>
  <line x1="446.0" y1="104" x2="446.0" y2="110" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="446.0" y="94" font-size="11" fill="#666" text-anchor="middle">100</text>
  <line x1="622.0" y1="104" x2="622.0" y2="110" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="622.0" y="94" font-size="11" fill="#666" text-anchor="middle">200</text>
  <line x1="798.0" y1="104" x2="798.0" y2="110" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="798.0" y="94" font-size="11" fill="#666" text-anchor="middle">300</text>
  <line x1="974.0" y1="104" x2="974.0" y2="110" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="974.0" y="94" font-size="11" fill="#666" text-anchor="middle">400</text>
  <line x1="1150.0" y1="104" x2="1150.0" y2="110" stroke="#9aa4b2" stroke-width="1.2"/>
  <text x="1150.0" y="94" font-size="11" fill="#666" text-anchor="middle">500 ms</text>
  <rect x="32" y="140" width="1176" height="122" rx="10" fill="#fbfcfd" stroke="#eef1f5"/>
  <rect x="32" y="300" width="1176" height="130" rx="10" fill="#fbfcfd" stroke="#eef1f5"/>
  <text x="44" y="182" font-size="15" fill="#b91c1c" font-weight="bold">场景 A</text>
  <text x="44" y="202" font-size="12" fill="#777">suspend / resume</text>
  <text x="44" y="222" font-size="11.5" fill="#999">唤醒是“命令”</text>
  <rect x="270" y="152" width="176.0" height="52" fill="#e9f6ee" stroke="#1f7a4d" stroke-width="1.3"/>
  <rect x="446.0" y="152" width="704.0" height="52" fill="url(#hatchRed)" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="282" y="183" font-size="11.5" fill="#1f7a4d">t 运行中</text>
  <text x="347.2" y="183" font-size="11.5" fill="#b45309">唤醒被丢弃</text>
  <text x="798.0" y="183" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">已挂起，永久</text>
  <rect x="248.7" y="118" width="113.0" height="22" rx="11" fill="#fff8ec" stroke="#b45309" stroke-width="1.2"/>
  <text x="305.2" y="133" font-size="11.5" fill="#b45309" text-anchor="middle">main: resume(t)</text>
  <line x1="305.2" y1="140" x2="305.2" y2="146" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="300.2" y1="145" x2="310.2" y2="155" stroke="#b91c1c" stroke-width="2.2"/>
  <line x1="310.2" y1="145" x2="300.2" y2="155" stroke="#b91c1c" stroke-width="2.2"/>
  <rect x="401.5" y="118" width="89.0" height="22" rx="11" fill="#fdecec" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="446.0" y="133" font-size="11.5" fill="#b91c1c" text-anchor="middle">t: suspend()</text>
  <line x1="446.0" y1="140" x2="446.0" y2="152" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arwRed)"/>
  <circle cx="282" cy="230" r="3.5" fill="#b45309"/>
  <text x="294" y="234" font-size="12" fill="#b45309">20 ms：resume(t) 打在“还没挂起”的线程上——不生效、不记账，唤醒就此丢失</text>
  <circle cx="282" cy="252" r="3.5" fill="#b91c1c"/>
  <text x="294" y="256" font-size="12" fill="#b91c1c">100 ms：t 才调用 suspend()，此后没有第二次 resume——永久挂起（500 ms 只是采样点）</text>
  <text x="44" y="340" font-size="15" fill="#1f7a4d" font-weight="bold">场景 B</text>
  <text x="44" y="360" font-size="12" fill="#777">park / unpark</text>
  <text x="44" y="380" font-size="11.5" fill="#999">唤醒是“状态”</text>
  <rect x="270" y="312" width="880.0" height="52" fill="#e9f6ee" stroke="#1f7a4d" stroke-width="1.3"/>
  <text x="282" y="343" font-size="11.5" fill="#1f7a4d">p 运行中</text>
  <rect x="344" y="322" width="62.0" height="22" rx="11" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.2"/>
  <text x="375.0" y="337" font-size="11.5" fill="#1f7a4d" text-anchor="middle">许可 +1</text>
  <line x1="446.0" y1="312" x2="446.0" y2="364" stroke="#1f7a4d" stroke-width="2"/>
  <text x="462.0" y="343" font-size="11.5" fill="#1f7a4d">消费许可，0 ms 返回，继续运行</text>
  <rect x="249.2" y="278" width="112.0" height="22" rx="11" fill="#fff8ec" stroke="#b45309" stroke-width="1.2"/>
  <text x="305.2" y="293" font-size="11.5" fill="#b45309" text-anchor="middle">main: unpark(p)</text>
  <line x1="305.2" y1="300" x2="305.2" y2="312" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arwOrange)"/>
  <rect x="411.0" y="278" width="70.0" height="22" rx="11" fill="#e9f6ee" stroke="#1f7a4d" stroke-width="1.2"/>
  <text x="446.0" y="293" font-size="11.5" fill="#1f7a4d" text-anchor="middle">p: park()</text>
  <line x1="446.0" y1="300" x2="446.0" y2="312" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#arwGreen)"/>
  <circle cx="282" cy="392" r="3.5" fill="#b45309"/>
  <text x="294" y="396" font-size="12" fill="#b45309">20 ms：unpark(p) 先到，p 还没 park——不丢，记成一张许可（permit = 1）</text>
  <circle cx="282" cy="414" r="3.5" fill="#1f7a4d"/>
  <text x="294" y="418" font-size="12" fill="#1f7a4d">100 ms：park() 到来，许可可用——立即消费并返回（0 ms），线程继续跑</text>
  <text x="44" y="466" font-size="11.5" fill="#999">图例</text>
  <rect x="90" y="454" width="20" height="13" fill="#e9f6ee" stroke="#1f7a4d" stroke-width="1.2"/>
  <text x="118" y="465" font-size="11.5" fill="#555">线程在运行</text>
  <rect x="210" y="454" width="20" height="13" fill="url(#hatchRed)" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="238" y="465" font-size="11.5" fill="#555">线程被挂起</text>
  <line x1="340" y1="460" x2="372" y2="460" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arwOrange)"/>
  <text x="382" y="465" font-size="11.5" fill="#555">20 ms 到达的唤醒</text>
  <line x1="512" y1="457" x2="522" y2="467" stroke="#b91c1c" stroke-width="2.2"/>
  <line x1="522" y1="457" x2="512" y2="467" stroke="#b91c1c" stroke-width="2.2"/>
  <text x="532" y="465" font-size="11.5" fill="#555">唤醒被丢弃</text>
  <text x="620.0" y="505" font-size="12" fill="#777" text-anchor="middle">同样的时间点，同样的“唤醒先到”：命令只作用于“此刻”，状态会留到“下次”。</text>
</svg>
