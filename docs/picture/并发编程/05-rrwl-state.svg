<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="PingFang SC, STHeiti, Helvetica, Arial, sans-serif">
  <title>读写锁 state 位布局</title>
  <defs>
    <marker id="arw555" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker>
    <marker id="arwblue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2456a6"/></marker>
    <marker id="arwgreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f7a4d"/></marker>
    <marker id="arworange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#ffffff"/>
<text x="620" y="42" font-size="22" fill="#1b2a41" text-anchor="middle" font-weight="bold">ReentrantReadWriteLock 的 state：一个 int 拆成两个 16 位计数</text>
<text x="620" y="70" font-size="13" fill="#777" text-anchor="middle">int 一共 32 位：高 16 位记读锁，低 16 位记写锁——读锁加 1 等于 state 加 65536</text>
<rect x="120" y="120" width="500" height="96" rx="6" fill="#eef4ff" stroke="#7a9cc6" stroke-width="1.8"/>
<rect x="620" y="120" width="500" height="96" rx="6" fill="#f3fbf6" stroke="#8fc7a6" stroke-width="1.8"/>
<text x="370" y="160" font-size="16" fill="#1b3d6b" text-anchor="middle" font-weight="bold">高 16 位：读锁计数</text>
<text x="370" y="188" font-size="13" fill="#3b5b84" text-anchor="middle">sharedCount(c) = c &gt;&gt;&gt; 16</text>
<text x="870" y="160" font-size="16" fill="#1f5f3d" text-anchor="middle" font-weight="bold">低 16 位：写锁计数</text>
<text x="870" y="188" font-size="13" fill="#33634a" text-anchor="middle">exclusiveCount(c) = c &amp; 0xFFFF</text>
<text x="120" y="112" font-size="11" fill="#888" text-anchor="start">bit 31</text>
<text x="1120" y="112" font-size="11" fill="#888" text-anchor="end">bit 0</text>
<text x="620" y="260" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="bold">举例：读锁被 3 个线程各持 1 次，写锁被当前线程重入 2 次</text>
<rect x="120" y="284" width="1000" height="56" rx="6" fill="#ffffff" stroke="#c9d3df" stroke-width="1.4"/>
<text x="620" y="320" font-size="17" fill="#1b2a41" text-anchor="middle" font-weight="bold">state = (3 &lt;&lt; 16) | 2 = 0x00030002 = 196610</text>
<rect x="120" y="372" width="1000" height="34" rx="4" fill="#f7f9fc" stroke="#c9d3df" stroke-width="1.1"/>
<text x="220" y="395" font-size="12.5" fill="#3b5b84" text-anchor="middle" font-weight="bold">运算</text>
<text x="500" y="395" font-size="12.5" fill="#3b5b84" text-anchor="middle" font-weight="bold">代码含义</text>
<text x="760" y="395" font-size="12.5" fill="#3b5b84" text-anchor="middle" font-weight="bold">结果</text>
<text x="1000" y="395" font-size="12.5" fill="#3b5b84" text-anchor="middle" font-weight="bold">说明</text>
<rect x="120" y="406" width="1000" height="34" rx="0" fill="#ffffff" stroke="#dde5ee" stroke-width="1.0"/>
<text x="220" y="428" font-size="12.5" fill="#1b2d45" text-anchor="middle">sharedCount(196610)</text>
<text x="500" y="428" font-size="12.5" fill="#1b2d45" text-anchor="middle">196610 &gt;&gt;&gt; 16</text>
<text x="760" y="428" font-size="12.5" fill="#1b2d45" text-anchor="middle" font-weight="bold">3</text>
<text x="1000" y="428" font-size="12" fill="#5a6b80" text-anchor="middle">读锁持有数</text>
<rect x="120" y="440" width="1000" height="34" rx="0" fill="#fbfcfe" stroke="#dde5ee" stroke-width="1.0"/>
<text x="220" y="462" font-size="12.5" fill="#1b2d45" text-anchor="middle">exclusiveCount(196610)</text>
<text x="500" y="462" font-size="12.5" fill="#1b2d45" text-anchor="middle">196610 &amp; 0xFFFF</text>
<text x="760" y="462" font-size="12.5" fill="#1b2d45" text-anchor="middle" font-weight="bold">2</text>
<text x="1000" y="462" font-size="12" fill="#5a6b80" text-anchor="middle">写锁重入次数</text>
<rect x="120" y="474" width="1000" height="34" rx="0" fill="#ffffff" stroke="#dde5ee" stroke-width="1.0"/>
<text x="220" y="496" font-size="12.5" fill="#1b2d45" text-anchor="middle">加一次读锁</text>
<text x="500" y="496" font-size="12.5" fill="#1b2d45" text-anchor="middle">state + (1 &lt;&lt; 16)</text>
<text x="760" y="496" font-size="12.5" fill="#1b2d45" text-anchor="middle" font-weight="bold">262146</text>
<text x="1000" y="496" font-size="12" fill="#5a6b80" text-anchor="middle">SHARED_UNIT = 65536</text>
<rect x="120" y="508" width="1000" height="34" rx="0" fill="#fbfcfe" stroke="#dde5ee" stroke-width="1.0"/>
<text x="220" y="530" font-size="12.5" fill="#1b2d45" text-anchor="middle">加一次写锁</text>
<text x="500" y="530" font-size="12.5" fill="#1b2d45" text-anchor="middle">state + 1</text>
<text x="760" y="530" font-size="12.5" fill="#1b2d45" text-anchor="middle" font-weight="bold">196611</text>
<text x="1000" y="530" font-size="12" fill="#5a6b80" text-anchor="middle">低 16 位加一</text>
<rect x="120" y="604" width="1000" height="28" rx="6" fill="#fff8ec" stroke="#e0b372" stroke-width="1.2"/>
<text x="620" y="623" font-size="12" fill="#8a5312" text-anchor="middle">每种计数上限都是 65535（MAX_COUNT）；溢出抛 Error，不是 Exception</text>
</svg>
