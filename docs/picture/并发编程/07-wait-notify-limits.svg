<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="PingFang SC, Hiragino Sans GB, STHeiti, Helvetica, Arial, sans-serif">
  <title>wait/notify 用在 AQS 上的三个限制</title>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8a94a6"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b45309"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2456a6"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1f7a4d"/>
    </marker>
    <pattern id="hatchRed" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#fdecec"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#e8a3a3" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1240" height="640" fill="#ffffff"/>
  <text x="620.0" y="40" font-size="22" fill="#1b2a41" text-anchor="middle" font-weight="bold">AQS 为什么用不了 wait / notify：三个限制</text>
  <text x="620.0" y="66" font-size="13" fill="#777" text-anchor="middle">wait/notify 绑定在“对象监视器”上；AQS 要的却是——不持锁排队、点名唤醒、通知不丢</text>
  <rect x="40" y="96" width="560" height="260" rx="10" fill="#fbfcfd" stroke="#eef1f5"/>
  <circle cx="68" cy="124" r="12" fill="#b45309"/>
  <text x="68" y="128.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="88" y="129" font-size="15.5" fill="#1b2a41" font-weight="bold">必须先拿到 monitor</text>
  <text x="60" y="152" font-size="11.5" fill="#777">Object.wait() 的前置条件，是当前线程持有这个对象的监视器</text>
  <rect x="60" y="162" width="266" height="24" rx="5" fill="#f4f6f9" stroke="#e3e8ef"/>
  <text x="70" y="178" font-size="11" fill="#44506b" font-family="Menlo, Consolas, monospace">synchronized (node) { node.wait(); }</text>
  <rect x="60" y="226" width="80" height="46" rx="7" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.4"/>
  <text x="100" y="246" font-size="12.5" fill="#1b2a41" text-anchor="middle">head</text>
  <text x="100" y="262" font-size="10.5" fill="#777" text-anchor="middle">哑节点</text>
  <rect x="188" y="226" width="80" height="46" rx="7" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.4"/>
  <text x="228" y="246" font-size="12.5" fill="#1b2a41" text-anchor="middle">Node1</text>
  <text x="228" y="262" font-size="10.5" fill="#777" text-anchor="middle">thread = T1</text>
  <rect x="316" y="226" width="80" height="46" rx="7" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.4"/>
  <text x="356" y="246" font-size="12.5" fill="#1b2a41" text-anchor="middle">Node2</text>
  <text x="356" y="262" font-size="10.5" fill="#777" text-anchor="middle">thread = T2</text>
  <rect x="444" y="226" width="80" height="46" rx="7" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.4"/>
  <text x="484" y="246" font-size="12.5" fill="#1b2a41" text-anchor="middle">Node3</text>
  <text x="484" y="262" font-size="10.5" fill="#777" text-anchor="middle">thread = T3</text>
  <line x1="142.0" y1="249.0" x2="186.0" y2="249.0" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="270.0" y1="249.0" x2="314.0" y2="249.0" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="398.0" y1="249.0" x2="442.0" y2="249.0" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ag)"/>
  <path d="M223,195 v-4 a5,5 0 0 1 10,0 v4" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <rect x="220" y="195" width="16" height="11" rx="2" fill="#fff8ec" stroke="#b45309" stroke-width="1.4"/>
  <line x1="228" y1="206" x2="228" y2="224" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M351,195 v-4 a5,5 0 0 1 10,0 v4" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <rect x="348" y="195" width="16" height="11" rx="2" fill="#fff8ec" stroke="#b45309" stroke-width="1.4"/>
  <line x1="356" y1="206" x2="356" y2="224" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M479,195 v-4 a5,5 0 0 1 10,0 v4" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <rect x="476" y="195" width="16" height="11" rx="2" fill="#fff8ec" stroke="#b45309" stroke-width="1.4"/>
  <line x1="484" y1="206" x2="484" y2="224" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="60" y="300" font-size="12" fill="#b45309">Node 只是链表节点，没有 monitor：硬要用 wait，就得给每个节点各造一把锁</text>
  <text x="60" y="324" font-size="11.5" fill="#999">→ 3 个排队线程 = 3 把额外的锁，还得自己管理它们的获取顺序</text>
  <rect x="640" y="96" width="560" height="260" rx="10" fill="#fbfcfd" stroke="#eef1f5"/>
  <circle cx="668" cy="124" r="12" fill="#2456a6"/>
  <text x="668" y="128.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="688" y="129" font-size="15.5" fill="#1b2a41" font-weight="bold">唤醒不能点名</text>
  <text x="660" y="152" font-size="11.5" fill="#777">notify() 只保证“叫醒一个”，叫谁由实现任意决定</text>
  <rect x="660" y="210" width="80" height="46" rx="7" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.4"/>
  <text x="700" y="230" font-size="12.5" fill="#1b2a41" text-anchor="middle">head</text>
  <text x="700" y="246" font-size="10.5" fill="#777" text-anchor="middle">哑节点</text>
  <rect x="788" y="210" width="80" height="46" rx="7" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.4"/>
  <text x="828" y="230" font-size="12.5" fill="#1b2a41" text-anchor="middle">Node1</text>
  <text x="828" y="246" font-size="10.5" fill="#777" text-anchor="middle">thread = T1</text>
  <rect x="916" y="210" width="80" height="46" rx="7" fill="#ffffff" stroke="#1f7a4d" stroke-width="2.4"/>
  <text x="956" y="230" font-size="12.5" fill="#1b2a41" text-anchor="middle">Node2</text>
  <text x="956" y="246" font-size="10.5" fill="#777" text-anchor="middle">thread = T2</text>
  <rect x="1044" y="210" width="80" height="46" rx="7" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.4"/>
  <text x="1084" y="230" font-size="12.5" fill="#1b2a41" text-anchor="middle">Node3</text>
  <text x="1084" y="246" font-size="10.5" fill="#777" text-anchor="middle">thread = T3</text>
  <line x1="742.0" y1="233.0" x2="786.0" y2="233.0" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="870.0" y1="233.0" x2="914.0" y2="233.0" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="998.0" y1="233.0" x2="1042.0" y2="233.0" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="878" y="176" width="156" height="22" rx="11" fill="#e9f6ee" stroke="#1f7a4d" stroke-width="1.2"/>
  <text x="956" y="191" font-size="11" fill="#1f7a4d" text-anchor="middle">要唤醒的是 head.next</text>
  <line x1="956" y1="198" x2="956" y2="208" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#agr)"/>
  <rect x="660" y="296" width="92" height="26" rx="13" fill="#eef3fb" stroke="#2456a6" stroke-width="1.3"/>
  <text x="706" y="314" font-size="12" fill="#2456a6" text-anchor="middle">notify()</text>
  <path d="M752,296 Q788,270 828,260" fill="none" stroke="#2456a6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ab)"/>
  <text x="800" y="278" font-size="12" fill="#2456a6" font-weight="bold">?</text>
  <path d="M752,296 Q916,270 956,260" fill="none" stroke="#2456a6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ab)"/>
  <text x="928" y="278" font-size="12" fill="#2456a6" font-weight="bold">?</text>
  <path d="M752,296 Q1044,270 1084,260" fill="none" stroke="#2456a6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ab)"/>
  <text x="1056" y="278" font-size="12" fill="#2456a6" font-weight="bold">?</text>
  <text x="764" y="316" font-size="11.5" fill="#2456a6">实现任选一个</text>
  <text x="660" y="342" font-size="12" fill="#2456a6">AQS 要唤醒的是确定那一个；notify 给不了这个保证</text>
  <rect x="40" y="366" width="1160" height="262" rx="10" fill="#fbfcfd" stroke="#eef1f5"/>
  <circle cx="68" cy="394" r="12" fill="#b91c1c"/>
  <text x="68" y="398.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="88" y="399" font-size="15.5" fill="#1b2a41" font-weight="bold">通知会丢：检查条件与 wait 之间的空档</text>
  <text x="60" y="422" font-size="11.5" fill="#777">T1 先检查条件、再调用 wait()，这两步之间不是原子的</text>
  <text x="60" y="462" font-size="11.5" fill="#44506b">T1（等条件）</text>
  <rect x="150" y="446" width="180" height="36" fill="#e9f6ee" stroke="#1f7a4d" stroke-width="1.3"/>
  <text x="240" y="469" font-size="11.5" fill="#1f7a4d" text-anchor="middle">检查 cond = false</text>
  <rect x="330" y="446" width="460" height="36" fill="#ffffff" stroke="#c9d1dc" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="560" y="469" font-size="11.5" fill="#777" text-anchor="middle">空档：还没走到 wait()</text>
  <rect x="790" y="446" width="360" height="36" fill="url(#hatchRed)" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="970" y="469" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="bold">永久等待：没人再叫它</text>
  <text x="60" y="514" font-size="11.5" fill="#44506b">T2（改条件）</text>
  <rect x="150" y="498" width="1000" height="36" fill="#f5f7fa" stroke="#d5dbe3" stroke-width="1.2"/>
  <rect x="600" y="498" width="170" height="36" fill="#e9f6ee" stroke="#1f7a4d" stroke-width="1.3"/>
  <text x="685" y="521" font-size="11.5" fill="#1f7a4d" text-anchor="middle">cond = true；notify()</text>
  <line x1="685" y1="498" x2="685" y2="486" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="790" y1="446" x2="790" y2="482" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="800" y="440" font-size="11.5" fill="#b91c1c">T1 此时才调 wait()</text>
  <line x1="680" y1="477" x2="690" y2="487" stroke="#b91c1c" stroke-width="2.2"/>
  <line x1="690" y1="477" x2="680" y2="487" stroke="#b91c1c" stroke-width="2.2"/>
  <text x="696" y="487" font-size="11.5" fill="#b91c1c">通知落空</text>
  <line x1="150" y1="572" x2="1120" y2="572" stroke="#9aa4b2" stroke-width="1.2" marker-end="url(#ag)"/>
  <text x="1132" y="576" font-size="11" fill="#777">时间</text>
  <text x="150" y="596" font-size="12" fill="#555">这次 notify 发生时没有线程在 wait 上，通知直接消失；等 T1 到达 wait()，只能一直睡下去。</text>
  <text x="150" y="616" font-size="11.5" fill="#999">官方 technote 的原话：miss a notify and remain suspended indefinitely</text>
</svg>
