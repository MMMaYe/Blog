<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" font-family="PingFang SC, Hiragino Sans GB, STHeiti, Helvetica, Arial, sans-serif">
  <title>一个完整回合（时序）：T1 抢到、T2 排队、T1 释放、T2 接手</title>
  <defs>
    <marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#44506b"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f7a4d"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2456a6"/></marker>
    <marker id="grey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8a94a6"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="980" fill="#ffffff"/>
  <text x="620.0" y="40" font-size="22" fill="#1b2a41" text-anchor="middle" font-weight="bold">一个完整回合（时序）：资源从 T1 交给 T2</text>
  <text x="620.0" y="66" font-size="13" fill="#777" text-anchor="middle">只 park 一次、unpark 一次；state 走 1 → 0 → 1，队列从无到有、再到出队</text>
  <line x1="200" y1="150" x2="200" y2="800" stroke="#c9d1dc" stroke-width="1.3" stroke-dasharray="6 5"/>
  <line x1="920" y1="150" x2="920" y2="800" stroke="#c9d1dc" stroke-width="1.3" stroke-dasharray="6 5"/>
  <line x1="580" y1="304" x2="580" y2="760" stroke="#c9d1dc" stroke-width="1.3" stroke-dasharray="6 5"/>
  <rect x="122" y="104" width="156" height="44" rx="8" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.6"/>
  <text x="200" y="124" font-size="13.5" fill="#1b2a41" text-anchor="middle" font-weight="bold">T1</text>
  <text x="200" y="140" font-size="10.5" fill="#777" text-anchor="middle">先到，持锁</text>
  <rect x="502" y="104" width="156" height="44" rx="8" fill="#ffffff" stroke="#8a94a6" stroke-width="1.6"/>
  <text x="580" y="124" font-size="13.5" fill="#1b2a41" text-anchor="middle" font-weight="bold">head 节点</text>
  <text x="580" y="140" font-size="10.5" fill="#777" text-anchor="middle">队列哑头（③ 才创建）</text>
  <rect x="842" y="104" width="156" height="44" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
  <text x="920" y="124" font-size="13.5" fill="#1b2a41" text-anchor="middle" font-weight="bold">T2</text>
  <text x="920" y="140" font-size="10.5" fill="#777" text-anchor="middle">后到，排队</text>
  <rect x="194" y="200" width="12" height="270" rx="6" fill="#1f7a4d" fill-opacity="0.16"/>
  <text x="216" y="300" font-size="11" fill="#1f7a4d">持有资源</text>
  <text x="216" y="316" font-size="10.5" fill="#1f7a4d">state = 1</text>
  <rect x="914" y="410" width="12" height="228" rx="6" fill="#b45309" fill-opacity="0.16"/>
  <text x="936" y="522" font-size="11" fill="#b45309">PARKED</text>
  <text x="936" y="538" font-size="10.5" fill="#b45309">不占 CPU</text>
  <rect x="34" y="185" width="132" height="26" rx="13" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-opacity="0.3"/>
  <text x="100" y="203" font-size="11" fill="#b45309" text-anchor="middle">state：0 → 1</text>
  <rect x="34" y="455" width="132" height="26" rx="13" fill="#1f7a4d" fill-opacity="0.08" stroke="#1f7a4d" stroke-opacity="0.3"/>
  <text x="100" y="473" font-size="11" fill="#1f7a4d" text-anchor="middle">state：1 → 0</text>
  <rect x="34" y="675" width="132" height="26" rx="13" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-opacity="0.3"/>
  <text x="100" y="693" font-size="11" fill="#b45309" text-anchor="middle">state：0 → 1</text>
  <path d="M200,200 h30 v18 h-30" fill="none" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#green)"/>
  <text x="240" y="213" font-size="12" fill="#1f7a4d">① lock() → tryAcquire(1) ✓</text>
  <text x="240" y="238" font-size="10.5" fill="#8a94a6">成功就返回，队列还没建（head == null）</text>
  <path d="M920,252 h30 v18 h-30" fill="none" stroke="#44506b" stroke-width="1.6" marker-end="url(#ink)"/>
  <text x="960" y="265" font-size="12" fill="#44506b">② acquire(1) → tryAcquire(1) ✗</text>
  <path d="M920,304 h30 v18 h-30" fill="none" stroke="#44506b" stroke-width="1.6" marker-end="url(#ink)"/>
  <text x="960" y="317" font-size="12" fill="#44506b">③ enq：建哑 head，T2 入队</text>
  <text x="510" y="322" font-size="10.5" fill="#8a94a6">哑 head 在此创建</text>
  <line x1="912" y1="356" x2="588" y2="356" stroke="#2456a6" stroke-width="1.7" marker-end="url(#blue)"/>
  <text x="681.5" y="346" font-size="12" fill="#2456a6" text-anchor="middle">④ head.waitStatus = SIGNAL</text>
  <path d="M920,410 h30 v18 h-30" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#orange)"/>
  <text x="960" y="423" font-size="12" fill="#b45309">⑤ parkAndCheckInterrupt → park()</text>
  <path d="M200,470 h30 v18 h-30" fill="none" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#green)"/>
  <text x="240" y="483" font-size="12" fill="#1f7a4d">⑥ unlock() → release(1)</text>
  <text x="240" y="508" font-size="10.5" fill="#8a94a6">tryRelease(1) ✓ → state 归 0</text>
  <line x1="208" y1="522" x2="572" y2="522" stroke="#2456a6" stroke-width="1.7" marker-end="url(#blue)"/>
  <text x="295.5" y="542" font-size="12" fill="#2456a6" text-anchor="middle">⑦ 读到 SIGNAL → CAS 清 0</text>
  <line x1="208" y1="574" x2="912" y2="574" stroke="#1f7a4d" stroke-width="1.7" marker-end="url(#green)"/>
  <text x="540" y="564" font-size="12" fill="#1f7a4d" text-anchor="middle">⑧ unparkSuccessor(head) → unpark(T2)：许可记账</text>
  <path d="M920,638 h30 v18 h-30" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#orange)"/>
  <text x="960" y="651" font-size="12" fill="#b45309">⑨ park() 返回（用掉许可）</text>
  <path d="M920,690 h30 v18 h-30" fill="none" stroke="#1f7a4d" stroke-width="1.6" marker-end="url(#green)"/>
  <text x="960" y="703" font-size="12" fill="#1f7a4d">⑩ p == head → tryAcquire(1) ✓</text>
  <line x1="912" y1="742" x2="588" y2="742" stroke="#44506b" stroke-width="1.7" marker-end="url(#ink)"/>
  <text x="685.0" y="732" font-size="12" fill="#44506b" text-anchor="middle">⑪ setHead：head = T2 的节点</text>
  <text x="550" y="762" font-size="10.5" fill="#8a94a6">旧 head 出队并被回收</text>
  <line x1="40" y1="822" x2="1200" y2="822" stroke="#e5eaf2" stroke-width="1"/>
  <text x="40" y="852" font-size="12.5" fill="#44506b"><tspan font-weight="bold">① 到 ⑤ 是 T2 一条执行流</tspan>：失败 → 入队 → 留话 → 睡下，全程没有对手戏。</text>
  <text x="40" y="878" font-size="12.5" fill="#44506b"><tspan font-weight="bold">⑥ 到 ⑧ 是 T1 一条执行流</tspan>：还资源 → 看到便条 → 点名唤醒；两条流只有 head 上的 waitStatus 相交。</text>
  <text x="40" y="904" font-size="12.5" fill="#44506b"><tspan font-weight="bold">⑨ 到 ⑪ 是 T2 被叫醒后的收尾</tspan>：park 返回不算拿到锁，必须重试成功并把自己变成新 head。</text>
  <text x="40" y="948" font-size="11.5" fill="#8a94a6">注：⑧ 的 unpark 若落在 ⑤ 之前，靠 1 位许可存住，不会丢——放大版见 09 时序图。</text>
</svg>
